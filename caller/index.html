<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<title>Caller</title><style>
:root{--bg:#0d1117;--card:#161b22;--line:#30363d;--tx:#e6edf3;--mut:#8b949e;--ac:#2f81f7;--ok:#3fb950;--wn:#d29922;--bad:#f85149}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
header{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:8px}
h1{font-size:18px;margin:0;font-weight:600}.sub{color:var(--mut);font-size:12px}header a{color:var(--mut);font-size:12px;text-decoration:none}
.tabs{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;gap:4px;padding:10px 20px 0;border-bottom:1px solid var(--line);overflow-x:auto}

.wrap{padding:20px;max-width:1500px;margin:0 auto}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:18px}

.kpi .v{font-size:24px;font-weight:600}.kpi .l{color:var(--mut);font-size:11px;text-transform:uppercase;letter-spacing:.4px}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.5px;color:var(--mut);margin:22px 0 10px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:16px}
.card h3{margin:0 0 6px;font-size:15px}
.row{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid var(--line);font-size:13px}
.row:last-child{border-bottom:none}.row span:first-child{color:var(--mut)}
.bar{height:6px;background:#21262d;border-radius:3px;overflow:hidden;margin:10px 0 14px}.bar i{display:block;height:100%;background:var(--ac)}
.pill{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:600}
.ok,.GOOD,.GREEN,.ACTIVE{background:rgba(63,185,80,.15);color:var(--ok)}.wn,.AMBER,.WARMUP-OFF,.AT-RISK{background:rgba(210,153,34,.15);color:var(--wn)}.bad,.RED,.BAD{background:rgba(248,81,73,.15);color:var(--bad)}
.err{color:var(--bad)}.chartbox{height:230px}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:6px}.half h4{margin:6px 0 2px;font-size:13px;color:var(--mut);font-weight:600}@media(max-width:640px){.pair{grid-template-columns:1fr}}
.empty{color:var(--mut);font-size:12px;padding:12px 0;text-align:center;border:1px dashed var(--line);border-radius:6px;margin-top:8px}
.rates{display:flex;gap:14px;flex-wrap:wrap;margin-top:6px;font-size:12px;color:var(--mut)}.rates b{color:var(--tx)}
.mb{color:var(--mut);font-size:12px;margin:4px 0 10px;word-break:break-all}
ul.act{margin:0;padding-left:18px}ul.act li{margin:4px 0}

details.ct{background:#161b22;border:1px solid #30363d;border-radius:10px;margin:8px 0;padding:0}details.ct summary{cursor:pointer;padding:12px 14px;font-weight:600;font-size:15px;list-style:none}details.ct summary::-webkit-details-marker{display:none}details.ct summary:before{content:"\25B8  ";color:#8b949e}details.ct[open] summary:before{content:"\25BE  "}details.ct .vb{padding:0 14px 14px}details.ct pre{white-space:pre-wrap;font:14px/1.45 -apple-system,system-ui,sans-serif;background:#0d1117;border:1px solid #30363d;border-radius:8px;padding:12px;margin:6px 0 12px;color:#e6edf3}details.ct .sj{color:#8b949e;font-size:13px;margin-top:8px}
.rsw{display:flex;gap:6px;margin:0 0 14px}.rsw button{background:var(--card);border:1px solid var(--line);color:var(--mut);padding:7px 16px;border-radius:20px;font:600 13px inherit;cursor:pointer}.rsw button.on{background:var(--ac);border-color:var(--ac);color:#fff}
.ol{display:grid;grid-template-columns:minmax(260px,400px) 1fr;gap:12px;align-items:start}@media(max-width:820px){.ol{grid-template-columns:1fr}}
.ll{background:var(--card);border:1px solid var(--line);border-radius:8px;max-height:72vh;overflow:auto}
.gd{position:sticky;top:0;z-index:2;background:#0d1117;padding:7px 12px;font-size:12px;font-weight:600;color:var(--tx);border-bottom:1px solid var(--line)}
.gv{padding:6px 12px 2px;font-size:11px;color:var(--ac);text-transform:uppercase;letter-spacing:.4px}
.it{padding:10px 12px;border-bottom:1px solid var(--line);cursor:pointer}.it:hover{background:#1c2129}.it.on{background:#1f2a3a;box-shadow:inset 3px 0 0 var(--ac)}
.it .f{display:flex;justify-content:space-between;gap:8px;font-weight:600;font-size:13px}.it .f small{color:var(--mut);font-weight:400}.it .s{font-size:12px;margin-top:2px}.it .p{color:var(--mut);font-size:12px;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pv{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:16px;min-height:320px;position:sticky;top:56px}.pv h3{margin:0 0 6px;font-size:16px}.pv .meta{color:var(--mut);font-size:12px;margin-bottom:12px;line-height:1.6}.pv pre{white-space:pre-wrap;word-break:break-word;font:14px/1.55 -apple-system,system-ui,sans-serif;background:#0d1117;border:1px solid var(--line);border-radius:8px;padding:14px;margin:0;color:var(--tx)}
.positive{background:rgba(63,185,80,.15);color:var(--ok)}.negative{background:rgba(248,81,73,.15);color:var(--bad)}.neutral{background:rgba(210,153,34,.15);color:var(--wn)}

@media(max-width:820px){.tabs{position:static;flex-wrap:wrap;overflow:visible;padding:8px 10px;gap:6px}.tabs button{border:1px solid var(--line);border-radius:16px;padding:6px 11px;font-size:12px;margin:0}.tabs button.on{background:var(--ac);border-color:var(--ac);color:#fff;margin-bottom:0}.wrap{padding:12px}.grid{grid-template-columns:1fr}.kpi .v{font-size:20px}}
.rsw{flex-wrap:wrap}
.rc{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:600}.rc-positive{background:rgba(63,185,80,.15);color:#3fb950}.rc-neutral{background:rgba(210,153,34,.15);color:#d29922}.rc-negative{background:rgba(248,81,73,.15);color:#f85149}.rc-no_contact,.rc-unknown{background:rgba(110,118,129,.2);color:#8b949e}
.ipg{display:grid;grid-template-columns:52px 1fr 1fr;gap:6px 10px;align-items:center}.iph{color:var(--mut);font-size:12px;font-weight:600}.ipl{color:var(--mut);font-size:12px}.ipc span{color:var(--mut);font-size:12px}.ipb{height:4px;background:var(--line);border-radius:2px;margin-top:2px;overflow:hidden}.ipb i{display:block;height:100%;background:var(--ok)}
.fchips{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:8px 0}.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border:1px solid rgba(127,127,127,.35);border-radius:999px;cursor:pointer;font-size:13px;user-select:none;opacity:.5;transition:all .15s}.chip.on{opacity:1;border-color:var(--ok);background:rgba(34,197,94,.12)}.chip input{accent-color:var(--ok);margin:0;cursor:pointer}.chip b{font-weight:600;color:var(--mut)}.fl{font-size:12px;color:var(--mut);margin-right:4px;min-width:56px}.lnk{background:none;border:none;color:var(--mut);cursor:pointer;font-size:12px;text-decoration:underline;padding:2px 4px}.cb{background:var(--card);border:1px solid var(--line);color:var(--tx);padding:9px 16px;border-radius:8px;font:600 14px inherit;cursor:pointer}.cb.go{background:var(--ok);border-color:var(--ok);color:#0d1117}.cb.sm{padding:3px 10px;font-size:12px}.cg{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}.cg label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--mut)}.cg input,.cg select{background:#0d1117;border:1px solid var(--line);color:var(--tx);padding:8px;border-radius:6px;font-size:14px}.tb{display:flex;border-bottom:1px solid #30363d;margin:12px -16px 0;padding:0 8px;position:sticky;top:0;background:var(--bg,#0d1117);z-index:5}
.tb a{flex:1;text-align:center;padding:12px 4px;font-size:15px;color:#8b949e;text-decoration:none;border-bottom:3px solid transparent;-webkit-tap-highlight-color:transparent}
.tb a.on{color:#e6edf3;border-bottom-color:var(--ac,#2f81f7);font-weight:600}
.sig{background:#1c2128;border:1px solid #30363d;border-radius:8px;padding:10px;margin:8px 0;font-size:15px;line-height:1.5}

.tb{display:flex;border-bottom:1px solid #30363d;margin:12px 0 0;position:sticky;top:0;background:#0d1117;z-index:5}
.tb a{flex:1;text-align:center;padding:12px 4px;font-size:16px;color:#8b949e;text-decoration:none;border-bottom:3px solid transparent}
.tb a.on{color:#e6edf3;border-bottom-color:#2f81f7;font-weight:600}
.fi{display:block;width:100%;font-size:16px;padding:10px;margin:8px 0;border-radius:8px;border:1px solid #30363d;background:#0d1117;color:#e6edf3;box-sizing:border-box}
.wide{display:block;width:100%;padding:12px;margin-top:8px;font-size:16px}
.msg{margin-top:10px;color:#f85149;font-size:14px}.lk{color:#58a6ff}
.btns{display:flex;gap:10px;margin-top:10px}.big{flex:1;padding:14px;font-size:18px}.cb[disabled]{opacity:.35}
.stl{font-size:17px;font-weight:600}.stl.ok{color:#3fb950}.stl.wn{color:#d29922}.stl.bad{color:#f85149}
.vh{background:#1c2128;border:1px solid #2f81f7;border-radius:8px;padding:8px 10px;margin:12px 0 4px;font-size:14px}
.sh{margin:16px 0 4px;font-size:15px;color:#8b949e;text-transform:uppercase;letter-spacing:.04em}
.say{background:#161b22;border-left:3px solid #2f81f7;padding:10px 12px;margin:6px 0;border-radius:4px;font-size:17px;line-height:1.5}
.tag{font-size:13px;color:#8b949e;margin-top:8px}.big1{font-size:20px;font-weight:700}.row1{font-size:15px;margin-top:4px}
.ll .it{padding:8px 0;border-bottom:1px solid #21262d;font-size:15px}
</style></head><body>
<main style="padding:12px 16px;max-width:720px;margin:0 auto"><div id="auth"></div>
<div id="app" style="display:none"><div id="phone"></div><div id="bar"></div><div id="tabs"></div><div id="pane"></div><div id="list"></div></div></main>
<script>
var API="https://zkylrolpuwybsksspblj.supabase.co/rest/v1/rpc/";
var K="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpreWxyb2xwdXd5YnNrc3NwYmxqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg5MTgwOTIsImV4cCI6MjA5NDQ5NDA5Mn0.xXfcM2u1FrZZujo-1KNnLGkPSkaoRGkjgk7KreB1TPM";
function $(i){return document.getElementById(i)}
function esc(s){return (s==null?"":String(s)).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function tc(s){return String(s||"").toLowerCase().replace(/\b\w/g,function(c){return c.toUpperCase()})}
function first(n){return String(n||"").split(" ")[0]||"there"}
function fmtPhone(p){var d=String(p||"").replace(/\D/g,"").slice(-10);return d.length===10?"("+d.slice(0,3)+") "+d.slice(3,6)+"-"+d.slice(6):p||""}
function dpost(f,b){return fetch(API+f,{method:"POST",headers:{apikey:K,Authorization:"Bearer "+K,"Content-Type":"application/json"},body:JSON.stringify(b)}).then(function(r){if(!r.ok)throw new Error(f+" "+r.status);return r.json()})}
var TOK="";try{TOK=localStorage.getItem("lgcs")||""}catch(e){}
var ST=null,CUR=null,TAB="script",BUSY=false,TIMER=null,DRAWN="";
var RES={connected_to_agent:"Talked to a person",voicemail:"Voicemail",no_human:"No person reached",no_answer:"No answer",timeout:"Timed out"};
var MON=["","Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];

/* ---------- auth ---------- */
function inp(id,type,ph,ac,enter){return '<input id="'+id+'" type="'+type+'" placeholder="'+ph+'" autocomplete="'+ac+'"'+(enter?' onkeydown="if(event.key===\'Enter\')'+enter+'"':'')+' class="fi">'}
function authBox(h){$("app").style.display="none";$("auth").style.display="block";$("auth").innerHTML='<div class="card" style="max-width:380px;margin:30px auto">'+h+'</div>'}
function showLogin(msg){authBox('<h3>Sign in</h3>'+inp("le","email","Email","username","$(\'lp\').focus()")+inp("lp","password","Password","current-password","doLogin()")+'<button class="cb go wide" onclick="doLogin()">Sign in</button><button class="cb wide" onclick="showSignup()">Sign up</button><div style="margin-top:12px"><a href="#" onclick="showSignup(1);return false" class="lk">Forgot password?</a></div><div id="lmsg" class="msg">'+esc(msg||"")+'</div>')}
function doLogin(){var e=$("le").value.trim(),p=$("lp").value;if(!e||!p)return;$("lmsg").textContent="Checking...";dpost("lg_caller_login",{p_email:e,p_password:p}).then(function(r){if(r.error){$("lmsg").textContent=r.error;return}setTok(r.token)}).catch(function(x){$("lmsg").textContent="Network error: "+x.message})}
function showSignup(reset){authBox('<h3>'+(reset?'Reset password':'Sign up')+'</h3><div class="sub">Enter your email. You get a 6-digit code.</div>'+inp("se","email","Email","username","sendCode()")+'<button class="cb go wide" onclick="sendCode()">Send code</button><div id="scode" style="display:none">'+inp("sc","text","6-digit code","one-time-code","$(\'sp\').focus()")+inp("sp","password","New password (8+ characters)","new-password","finishSignup()")+'<button class="cb go wide" onclick="finishSignup()">Save and sign in</button></div><button class="cb wide" onclick="showLogin()">Sign in</button><div id="lmsg" class="msg"></div>')}
function sendCode(){var e=$("se").value.trim();if(!e)return;$("lmsg").textContent="Sending...";dpost("lg_caller_code_start",{p_email:e}).then(function(r){$("lmsg").textContent=r.msg||r.error||"";$("scode").style.display="block";$("sc").focus()}).catch(function(x){$("lmsg").textContent="Network error: "+x.message})}
function finishSignup(){var e=$("se").value.trim(),c=$("sc").value.trim(),pw=$("sp").value;if(pw.length<8){$("lmsg").textContent="Use at least 8 characters";return}$("lmsg").textContent="Checking...";
 dpost("lg_caller_code_finish",{p_email:e,p_code:c,p_password:pw}).then(function(r){if(r.error){$("lmsg").textContent=r.error;return}setTok(r.token)}).catch(function(x){$("lmsg").textContent="Network error: "+x.message})}
function setTok(t){TOK=t;try{localStorage.setItem("lgcs",t)}catch(x){}start()}
function logout(){var t=TOK;TOK="";try{localStorage.removeItem("lgcs")}catch(x){}dpost("lg_caller_logout",{p_tok:t}).catch(function(){});if(TIMER){clearInterval(TIMER);TIMER=null}showLogin()}

/* ---------- data ---------- */
function start(){$("auth").style.display="none";$("app").style.display="block";refresh(true);if(!TIMER)TIMER=setInterval(function(){if(!document.hidden)refresh()},5000)}
function refresh(force){if(!TOK){showLogin();return}
 Promise.all([dpost("lg_dialer_state",{p_pin:TOK}),dpost("lg_dialer_current",{p_pin:TOK})]).then(function(a){
  if(a[0].error||a[1].error){TOK="";try{localStorage.removeItem("lgcs")}catch(x){}showLogin("Please sign in again.");return}
  ST=a[0];CUR=a[1].none?null:a[1];draw(force)}).catch(function(e){$("bar").innerHTML='<div class="err">Connection problem: '+esc(e.message)+'</div>'})}

/* ---------- actions ---------- */
function act(a,args){if(BUSY)return;BUSY=true;drawBar();
 var notes=$("cnotes")?$("cnotes").value:"";var p=Promise.resolve();
 if(CUR&&CUR.call_id&&notes.trim()&&notes!==SAVEDNOTE)p=saveNote().catch(function(){});
 p.then(function(){return dpost("lg_dialer_control",{p_pin:TOK,p_action:a,p_args:args||{}})}).then(function(r){BUSY=false;if(r&&r.error)alert(r.error);DRAWN="";refresh(true)}).catch(function(e){BUSY=false;alert("Failed: "+e.message);refresh(true)})}
function doCall(){if(!ST)return;if(!ST.config.active)act("start");else act("next",CUR&&CUR.call_id?{call_id:CUR.call_id}:{})}
function doPostpone(){if(!CUR)return;act("postpone",CUR.call_id?{call_id:CUR.call_id}:{queue_id:CUR.queue_id})}
function doStop(){act("stop")}

/* ---------- render ---------- */
function stateInfo(){var c=ST.config;if(!CUR)return {t:c.active?"Dialing...":"List is empty",cls:"wn",canCall:!c.active,canPost:false};
 if(CUR.state==="dialing")return {t:"Bot is dialing "+esc(CUR.contact||CUR.company),cls:"wn",canCall:false,canPost:false};
 if(CUR.state==="transferred")return {t:"On the line with you",cls:"ok",canCall:false,canPost:false};
 if(CUR.state==="ended")return {t:"Call ended: "+(RES[CUR.result]||CUR.result||""),cls:CUR.result==="connected_to_agent"?"ok":"bad",canCall:true,canPost:true};
 return {t:c.active?"Dialing...":"Next: "+esc(CUR.contact||CUR.company),cls:"",canCall:!c.active,canPost:!c.active}}
function drawPhone(){var e=$("myph");if(e&&document.activeElement===e)return;var v=ST.my_phone||"";
 $("phone").innerHTML='<div class="card" style="margin-bottom:10px'+(v?'':';border-color:#d29922')+'"><div class="sub">'+(v?'Live people are put through to your phone:':'<b style="color:#d29922">Enter your phone number to start calling</b>')+'</div>'
 +'<div style="display:flex;gap:8px;align-items:center"><input id="myph" class="fi" type="tel" inputmode="tel" autocomplete="tel" placeholder="+1 305 555 1234" value="'+esc(v)+'" onkeydown="if(event.key===\'Enter\')savePhone()" style="flex:1;margin:6px 0"><button class="cb go" onclick="savePhone()">Save</button></div><div id="phmsg" class="msg"></div></div>'}
function savePhone(){var v=$("myph").value.trim();if(!v)return;$("phmsg").textContent="Saving...";dpost("lg_caller_set_phone",{p_tok:TOK,p_phone:v}).then(function(r){if(r.error){$("phmsg").textContent=r.error;return}ST.my_phone=r.phone;$("myph").blur();drawPhone();$("phmsg").style.color="#3fb950";$("phmsg").textContent="Saved: "+r.phone;drawBar()}).catch(function(e){$("phmsg").textContent="Failed: "+e.message})}
function drawBar(){if(!ST)return;var s=stateInfo(),c=ST.config;if(!ST.my_phone){s.canCall=false}
 $("bar").innerHTML='<div class="card"><div class="stl '+s.cls+'">'+s.t+'</div>'
  +'<div class="btns"><button class="cb go big" '+((s.canCall&&!BUSY)?'':'disabled')+' onclick="doCall()">'+(BUSY?'...':'Call')+'</button>'
  +'<button class="cb big" '+((s.canPost&&!BUSY)?'':'disabled')+' onclick="doPostpone()">Postpone</button></div>'
  +'<div class="sub" style="margin-top:8px">'+(c.active?'Running | <a href="#" class="lk" onclick="doStop();return false">Stop</a> | ':'Stopped | ')+'Miami '+esc(ST.et)+' | '+esc(ST.me||'')+' | <a href="#" class="lk" onclick="logout();return false">Sign out</a></div></div>'}
function drawTabs(){$("tabs").innerHTML='<div class="tb"><a href="#" class="'+(TAB==="script"?"on":"")+'" onclick="TAB=\'script\';DRAWN=\'\';draw(true);return false">Script</a><a href="#" class="'+(TAB==="prospect"?"on":"")+'" onclick="TAB=\'prospect\';DRAWN=\'\';draw(true);return false">Prospect</a></div>'}
function L(s){return '<div class="say">'+s+'</div>'}
function H(t){return '<h3 class="sh">'+t+'</h3>'}
function signals(c){var s=c.sig||{},w=c.why||"",out=[],addr=esc(tc(c.address)||"the building");
 if(s.recent_buy||/recent purchase/.test(w)){var when=s.sale_yr?((MON[s.sale_mo||0]||"")+" "+s.sale_yr).trim():"";
  out.push({t:"Recent purchase"+(when?" ("+when+")":""),say:"Congratulations on buying "+addr+(when?" in "+when:"")+". Have you set up management for it yet?"})}
 if(/no manager/.test(w))out.push({t:"No management company listed",say:"I noticed "+addr+" does not list a management company. Are you managing it yourself?"});
 if(s.oos||/out-of-state/.test(w)){var fr=s.own_city?tc(s.own_city)+(s.own_state?", "+s.own_state:""):"out of state";
  out.push({t:"Owner lives out of state ("+esc(fr)+")",say:"I see you are based in "+esc(fr)+". Running a building in Florida from there can take a lot of time. How do you handle it today?"})}
 var m=(w.match(/mgr: ([^,]+)/)||[])[1];if(m)out.push({t:"Current manager: "+esc(m),say:"I see "+esc(m)+" manages it today. Are you happy with them?"});
 if(s.recert_open)out.push({t:"Recertification open",say:"I also saw the building has an open recertification. Who is handling that for you?"});
 return out}
function scriptOwner(c){var nm=esc(c.contact||"the owner"),fn=esc(first(c.contact)),addr=esc(tc(c.address)||c.place||"your building"),city=esc(tc(c.city)),sg=signals(c);
 var h='<div class="vh">Property management | KHI owners | '+nm+', '+addr+(c.units?' ('+c.units+' units)':'')+'</div>';
 h+=H("Opening")+L('Hi, is this <b>'+nm+'</b>? This is Alex from aiProcess in Miami. I\'m calling about your apartment building at <b>'+addr+(city?', '+city:'')+'</b>. Do you have one minute?');
 if(sg.length){h+=H("Why I'm calling");sg.forEach(function(g,i){h+='<div class="tag">'+(i===0?'Main reason':'Or')+': '+g.t+'</div>'+L(g.say)})}
 h+=H("Who manages it")+L("Who manages the property today?");
